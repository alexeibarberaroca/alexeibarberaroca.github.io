# Publica la web en GitHub Pages cada vez que se sube algo a main.
# Antes, una sola vez: Settings → Pages → Source: «GitHub Actions».
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path sale de la dirección que da GitHub: vacío en usuario.github.io
      # o con dominio propio, /repositorio en usuario.github.io/repositorio/.
      - name: Generar la web estática
        run: |
          python main.py --build \
            --base-path "${{ steps.pages.outputs.base_path }}" \
            --site-url "${{ steps.pages.outputs.origin }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
